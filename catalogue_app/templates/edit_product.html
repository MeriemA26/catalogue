{% extends 'base.html' %}

{% block content %}
<h2>Édition du produit</h2>

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success">
                <i class="fas fa-save"></i> Enregistrer
            </button>
            <a href="{% url 'upload' %}" class="btn btn-secondary">Retour</a>
        </form>
    </div>
</div>

<div class="card mt-4">
    <div class="card-header">
        <h5>Informations extraites</h5>
    </div>
    <div class="card-body">
        <pre>{{ produit.extrait_texte }}</pre>
    </div>
</div>
{% endblock %}
