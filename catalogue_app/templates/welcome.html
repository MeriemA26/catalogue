<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue Délice</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        html {
            background: linear-gradient(135deg, #142c54 0%, #2d5aa8 50%, #4a7cc9 100%);
        }

        body {
            width: 100%;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at 15% 20%, rgba(255,255,255,0.06) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(255,255,255,0.05) 0%, transparent 45%),
                linear-gradient(135deg, #142c54 0%, #2d5aa8 50%, #4a7cc9 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 40px 20px;
            overflow-y: auto;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
            animation: float 8s ease-in-out infinite;
        }
        .shape1 { width: 320px; height: 320px; top: -120px; left: -100px; animation-delay: 0s; }
        .shape2 { width: 220px; height: 220px; bottom: -70px; right: -70px; animation-delay: 2s; }
        .shape3 { width: 130px; height: 130px; top: 18%; right: 10%; animation-delay: 4s; }
        .shape4 { width: 90px; height: 90px; bottom: 18%; left: 8%; animation-delay: 1s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-25px) scale(1.05); }
        }

        /* Icônes laitières éparpillées sur toute la page */
        .dairy-icon {
            position: absolute;
            color: rgba(255,255,255,0.12);
            z-index: 1;
            animation: float 9s ease-in-out infinite;
        }
        .dairy-icon.i1 { top: 10%;  left: 8%;   font-size: 30px; animation-delay: 0.5s; }
        .dairy-icon.i2 { top: 15%;  left: 88%;  font-size: 24px; animation-delay: 2s; }
        .dairy-icon.i3 { top: 38%;  left: 5%;   font-size: 22px; animation-delay: 3.5s; }
        .dairy-icon.i4 { top: 42%;  left: 92%;  font-size: 28px; animation-delay: 1.2s; }
        .dairy-icon.i5 { top: 68%;  left: 10%;  font-size: 26px; animation-delay: 2.8s; }
        .dairy-icon.i6 { top: 72%;  left: 90%;  font-size: 22px; animation-delay: 4.2s; }
        .dairy-icon.i7 { top: 88%;  left: 20%;  font-size: 20px; animation-delay: 1.8s; }
        .dairy-icon.i8 { top: 90%;  left: 78%;  font-size: 26px; animation-delay: 3s; }

        .hero {
            text-align: center;
            color: white;
            margin-bottom: 34px;
            z-index: 2;
            animation: fadeDown 0.8s ease-out;
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero .logo-badge {
            width: 88px;
            height: 88px;
            border-radius: 24px;
            background: rgba(255,255,255,0.14);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 22px;
            border: 1px solid rgba(255,255,255,0.28);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .hero .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.65);
            margin-bottom: 10px;
        }

        .hero .eyebrow::before,
        .hero .eyebrow::after {
            content: '';
            width: 20px;
            height: 1px;
            background: rgba(255,255,255,0.35);
        }

        .hero h1 {
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            font-size: 2.6rem;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 1.02rem;
            color: rgba(255,255,255,0.8);
        }

        .cards {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 2;
            margin-top: 42px;
            animation: fadeUp 0.8s ease-out 0.2s both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .role-card {
            width: 270px;
            background: rgba(255,255,255,0.98);
            border-radius: 22px;
            padding: 38px 30px;
            text-align: center;
            color: #1e293b;
            box-shadow: 0 20px 50px rgba(10, 25, 60, 0.28);
            transition: transform 0.35s ease, box-shadow 0.35s ease;
            position: relative;
            overflow: hidden;
            cursor: default;
            border: 1px solid rgba(255,255,255,0.5);
            z-index: 2;
        }

        .role-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 4px;
            background: linear-gradient(90deg, #3D6AC1, #5a8fd8);
            transition: left 0.4s ease;
        }
        .role-card.employe-card::before {
            background: linear-gradient(90deg, #6c757d, #9aa1a8);
        }

        .role-card:hover::before { left: 0; }

        .role-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 28px 60px rgba(10, 25, 60, 0.35);
        }

        .role-icon {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
            color: white;
            margin: 0 auto 20px;
            transition: transform 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        .role-card:hover .role-icon { transform: scale(1.08) rotate(-4deg); }

        .icon-admin { background: linear-gradient(135deg, #3D6AC1, #1e3c72); }
        .icon-employe { background: linear-gradient(135deg, #8a929a, #4a505a); }

        .role-card h3 {
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 1.25rem;
            margin-bottom: 8px;
            color: #0f2547;
        }

        .role-card p {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 24px;
            line-height: 1.5;
            min-height: 42px;
        }

        .role-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            color: white;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .role-btn:hover { transform: translateY(-2px); }

        .role-card .role-btn.admin {
            background: #3D6AC1;
            box-shadow: 0 8px 18px rgba(61,106,193,0.35);
        }
        .role-card .role-btn.employe {
            background: #6c757d;
            box-shadow: 0 8px 18px rgba(108,117,125,0.3);
            width: 100%;
        }
        .role-btn.admin-outline {
            background: transparent;
            border: 2px solid #3D6AC1;
            color: #3D6AC1;
        }
        .role-btn.admin-outline:hover { background: #3D6AC1; color: white; }

        .btn-row {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .btn-row .role-btn.admin { flex: 1.3; }
        .btn-row .role-btn.admin-outline { flex: 1; padding-left: 14px; padding-right: 14px; }

        footer {
            margin-top: 44px;
            color: rgba(255,255,255,0.55);
            font-size: 0.78rem;
            z-index: 2;
            text-align: center;
        }

        @media (max-width: 600px) {
            .hero h1 { font-size: 2rem; }
            .cards { flex-direction: column; align-items: center; }
            .role-card { width: 100%; max-width: 300px; }
            .dairy-icon { display: none; }
        }
    </style>
</head>
<body>
    <div class="shape shape1"></div>
    <div class="shape shape2"></div>
    <div class="shape shape3"></div>
    <div class="shape shape4"></div>

    <!-- Icônes laitières éparpillées sur tout le fond -->
    <i class="fas fa-wine-bottle dairy-icon i1"></i>
    <i class="fas fa-mug-saucer dairy-icon i2"></i>
    <i class="fas fa-cube dairy-icon i3"></i>
    <i class="fas fa-cheese dairy-icon i4"></i>
    <i class="fas fa-tint dairy-icon i5"></i>
    <i class="fas fa-wine-bottle dairy-icon i6"></i>
    <i class="fas fa-cheese dairy-icon i7"></i>
    <i class="fas fa-mug-saucer dairy-icon i8"></i>

    <div class="hero">
        <div class="logo-badge"><i class="fas fa-box-open"></i></div>
        <h1>Catalogue Délice</h1>
        <p>Choisissez votre espace pour continuer</p>
    </div>

    <div class="cards">
        <div class="role-card">
            <div class="role-icon icon-admin"><i class="fas fa-shield-alt"></i></div>
            <h3>Administrateur</h3>
            <p>Gestion des comptes, suivi complet des actions et accès total</p>
            <div class="btn-row">
                <a href="{% url 'login' %}?role=admin" class="role-btn admin">
                    <i class="fas fa-sign-in-alt"></i> Connexion
                </a>
                <a href="{% url 'register_admin' %}" class="role-btn admin-outline">
                    <i class="fas fa-user-plus"></i> Créer
                </a>
            </div>
        </div>

        <div class="role-card employe-card">
            <div class="role-icon icon-employe"><i class="fas fa-user"></i></div>
            <h3>Employé</h3>
            <p>Importation des catalogues et gestion des produits</p>
            <a href="{% url 'login' %}?role=employe" class="role-btn employe">
                <i class="fas fa-sign-in-alt"></i> Connexion
            </a>
        </div>
    </div>
</body>
</html>
